<!DOCTYPE html>
<html lang="pt-br" xmlns="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<h1>Séries</h1>
</head>

<body>
	<h1>Séries Cadastradas</h1>

	<table border="1">
		<thead>
			<tr>
				<th>Nome</th>
				<th>Plataforma</th>
				<th>Ano</th>
				<th>Genero</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="serie: ${series}">
				<td th:text="${serie.nome}"></td>
				<td th:text="${serie.plataforma}"></td>
				<td th:text="${serie.anoLancamento}"></td>
				<td th:text="${serie.genero}"></td>
			</tr>
		</tbody>
	</table>
</body>

</html>
